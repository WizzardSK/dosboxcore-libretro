# Fork-only preflight for the webOS job this branch adds. The buildbot has
# the SDK baked into its image; here it is downloaded from the openlgtv
# release that image is built from.
name: preflight (webos)

on:
  workflow_dispatch:
  push:
    branches:
      - preflight-**

jobs:
  webos-armv7a:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      SDK_ROOT: /developer/arm-webos-linux-gnueabi_sdk-buildroot
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake libtool libtool-bin ninja-build cmake python3-pip
          python3 -m pip install --break-system-packages --no-cache-dir "meson==0.55.3" ninja || \
          python3 -m pip install --no-cache-dir "meson==0.55.3" ninja

      - name: webOS SDK
        run: |
          url=$(curl -s https://api.github.com/repos/openlgtv/buildroot-nc4/releases/latest \
            | grep -o 'https://[^"]*arm-webos-linux-gnueabi_sdk-buildroot-x86_64.tar.gz' | head -1)
          echo "SDK: $url"
          sudo mkdir -p /developer
          curl -sL "$url" | sudo tar -xz -C /developer
          sudo "$SDK_ROOT/relocate-sdk.sh"
          . "$SDK_ROOT/environment-setup"
          arm-webos-linux-gnueabi-gcc --version | head -1

      - name: Build
        run: |
          . "$SDK_ROOT/environment-setup"
          export CC_FOR_BUILD=/usr/bin/gcc CXX_FOR_BUILD=/usr/bin/g++
          # Bare tool names, so the Makefile can build the prefixed ones from
          # TARGET_TRIPLET itself - the SDK's environment-setup has already
          # set them to the prefixed names, which would end up doubled.
          export AR=ar AS=as CC=gcc CXX=g++ LD=ld
          # The SDK's pkg-config wrapper rewrites reported paths to sit
          # under the sysroot and sets that up itself, so use the plain one
          # and point it at nothing but the .pc files we build.
          export PKG_CONFIG=/usr/bin/pkg-config
          export PKG_CONFIG_LIBDIR="$PWD/libretro/deps_bin/lib/pkgconfig"
          export platform=unix TARGET_TRIPLET=arm-webos-linux-gnueabi
          export BUNDLED_AUDIO_CODECS=1 BUNDLED_LIBSNDFILE=1 BUNDLED_SDL=1
          export CMAKE_GENERATOR=Ninja STATIC_LIBCXX=1 WITH_BASSMIDI=1
          export WITH_ALSA_MIDI=0 WITH_DYNAREC=arm WITH_FLUIDSYNTH=1 WITH_VOODOO=1
          echo "--- environment the SDK left us with:"
          env | grep -iE '^(CC|CXX|LD|AR|AS|CMAKE|PKG_CONFIG)' | sort
          export EXTRA_CMAKE_FLAGS="-DCMAKE_CXX_STANDARD=17 -DPKG_CONFIG_EXECUTABLE=/usr/bin/pkg-config -DCMAKE_TOOLCHAIN_FILE=$SDK_ROOT/share/buildroot/toolchainfile.cmake"
          touch libretro/deps/sdl_net/aclocal.m4 libretro/deps/mpg123/aclocal.m4
          sleep 1
          find libretro/deps/sdl_net/ libretro/deps/mpg123/ -name "*.in" -exec touch '{}' \;
          sleep 1
          touch libretro/deps/sdl_net/configure libretro/deps/mpg123/configure
          # CMAKE on the command line, not in the environment: the Makefile
          # assigns it with = and that beats the environment. The SDK's own
          # cmake is a buildroot build linked against libssl 1.1.
          make -C libretro -f Makefile.libretro CMAKE=/usr/bin/cmake PKGCONFIG=/usr/bin/pkg-config clean
          make -C libretro -f Makefile.libretro CMAKE=/usr/bin/cmake PKGCONFIG=/usr/bin/pkg-config deps
          LDFLAGS="-Wl,--no-undefined" make -C libretro -f Makefile.libretro CMAKE=/usr/bin/cmake PKGCONFIG=/usr/bin/pkg-config -j$(nproc)

      - name: Check
        run: |
          ls -l libretro/dosbox_core_libretro.so
          file libretro/dosbox_core_libretro.so
          file libretro/dosbox_core_libretro.so | grep -q "ARM"
