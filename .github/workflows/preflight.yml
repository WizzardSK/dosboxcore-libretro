# Fork-only preflight for the webOS job's missing autotools.
#
# The full cross build was already proven on this fork; what this checks is
# the step the buildbot stops at: deps/flac/autogen.sh, run with nothing but
# the packages the webOS image installs plus the ones the job now adds.
name: preflight (webos)

on:
  workflow_dispatch:
  push:
    branches:
      - preflight-**

jobs:
  flac-autogen:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:noble
      options: --user root
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: What the webOS image ships (its Dockerfile, verbatim)
        run: |
          apt-get update -qy
          apt-get install -y sudo curl wget file make git cmake pkg-config vim ninja-build g++ build-essential libclang-dev

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: autogen.sh without the fix, expected to fail
        run: |
          cd libretro/deps/flac
          if ./autogen.sh; then echo "unexpectedly succeeded"; exit 1; fi
          echo "failed as it does on the buildbot"

      - name: The line the job now runs
        run: |
          apt-get update -qy
          apt-get install -qy autoconf automake libtool libtool-bin gettext

      - name: autogen.sh with the fix
        run: |
          cd libretro/deps/flac
          ./autogen.sh
          test -x ./configure
          ./configure --help > /dev/null
